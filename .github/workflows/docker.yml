# MirrorHub GHCR + Release 二进制
#
# 发版约定（避免 main 与 v* tag 各跑一遍多架构构建）：
#   1. 发版提交 message 必须以「release:」开头（可空提交）
#        git commit --allow-empty -m "release: v3.4"
#   2. 打 annotated tag 后推送 branch 与 tag
#        git tag -a v3.4 -m "MirrorHub v3.4"
#        git push origin main && git push origin v3.4
#   3. 以 release: 开头的 main/master 推送会跳过 build job；仅 tag 推送构建
#      多架构镜像（注入正式 VERSION）并上传 release-binaries。
# 日常非发版 push：仍构建并推送 sha 标签，VERSION=dev。
name: docker

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

# 同一仓库同时只跑一个 GHCR 构建，避免 latest / 版本号 / sha 落在不同 digest
concurrency:
  group: docker-ghcr
  cancel-in-progress: false

jobs:
  build:
    # 跳过「release:」开头的 branch push，只保留 tag / PR / workflow_dispatch
    if: >
      github.event_name != 'push' ||
      github.ref_type == 'tag' ||
      startsWith(github.event.head_commit.message || '', 'release:') == false
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Image name (lowercase)
        run: echo "IMAGE_NAME=${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Resolve VERSION for ldflags
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          else
            echo "VERSION=dev" >> "$GITHUB_ENV"
          fi

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      # 若仍 write_package denied：仓库 Settings → Actions → Workflow permissions
      # 选 Read and write；或添加 Secret GHCR_TOKEN（classic PAT: write:packages）
      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GHCR_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            # latest 只跟 release tag，避免与 main 并发推送后和版本号 digest 错位
            type=raw,value=latest,enable=${{ github.ref_type == 'tag' }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            # v1.2 不是完整 SemVer（缺 patch），仍发布 1.2 风格短标签
            type=match,pattern=^v(\d+\.\d+(?:\.\d+)?)$,group=1
            type=sha,prefix=
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ env.VERSION }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false
          sbom: false

  # tag 发布时额外上传可在线升级的二进制资产
  release-binaries:
    if: github.event_name == 'push' && github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: yarn
          cache-dependency-path: frontend/yarn.lock

      - name: Build frontend
        working-directory: frontend
        run: |
          yarn config set network-timeout 600000
          yarn install --frozen-lockfile
          yarn build

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache-dependency-path: backend/go.sum

      - name: Embed frontend into webui
        run: |
          rm -rf backend/internal/webui/dist
          mkdir -p backend/internal/webui/dist
          cp -a frontend/dist/. backend/internal/webui/dist/

      - name: Build release binaries
        working-directory: backend
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          VERSION="${VERSION#v}"
          mkdir -p dist
          for pair in linux/amd64 linux/arm64; do
            GOOS=${pair%/*}
            GOARCH=${pair#*/}
            out="dist/mirrorhub_${GOOS}_${GOARCH}"
            CGO_ENABLED=0 GOOS="$GOOS" GOARCH="$GOARCH" go build -trimpath \
              -ldflags="-s -w -X github.com/livehl/mirrorhub/internal/version.Version=${VERSION}" \
              -o "$out" ./cmd/mirrorhub
          done
          (cd dist && sha256sum mirrorhub_linux_amd64 mirrorhub_linux_arm64 > SHA256SUMS)

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            backend/dist/mirrorhub_linux_amd64
            backend/dist/mirrorhub_linux_arm64
            backend/dist/SHA256SUMS
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
