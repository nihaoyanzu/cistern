# Cistern 单容器部署：内置 SQLite + 嵌入管理台
services:
  cistern:
    image: ghcr.io/nihaoyanzu/cistern:latest
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    container_name: cistern
    ports:
      - "18081:18081" # 下载服务（pip -i）
      - "18082:18082" # 管理台 Web / API
    environment:
      CISTERN_DATA_DIR: /data
      CISTERN_PROXY_ADDR: ":18081"
      CISTERN_ADMIN_ADDR: ":18082"
      CISTERN_LOG_LEVEL: info
      # 可选：固定 JWT；不填则首次启动写入 /data/jwt_secret
      # CISTERN_JWT_SECRET: change-me
      # 默认不设 DATABASE_URL → /data/cistern.db（SQLite）
      # 若仍要用外部 Postgres，取消下一行并自行提供可达地址：
      # DATABASE_URL: postgres://user:pass@host:5432/cistern?sslmode=disable
    volumes:
      - cistern_data:/data
    restart: unless-stopped

volumes:
  cistern_data:
